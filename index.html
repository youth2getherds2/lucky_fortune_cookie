<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세 · 포춘쿠키</title>
<meta name="description" content="대상 대학생 봉사단 9기 X 형제식당 - 포춘쿠키를 열어 오늘의 운세와 행운의 음식을 확인해보세요.">
<meta name="theme-color" content="#FBF3E7">
<meta property="og:type" content="website">
<meta property="og:title" content="오늘의 운세 · 포춘쿠키">
<meta property="og:description" content="포춘쿠키를 통해 오늘의 운세를 확인해보세요!">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥠</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E7;
    --paper-deep:#F3E7D4;
    --ink:#2B211B;
    --ink-muted:#8A7B6C;
    --seal:#C23B22;
    --seal-dark:#9C2C18;
    --gold:#C79A3B;
    --card:#FFFDF8;
    --line: rgba(43,33,27,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body{
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(199,154,59,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(194,59,34,0.08), transparent 45%);
  }

  .stage{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 56px 24px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mark{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--seal);
    color: #FBF3E7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -1px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    margin-bottom: 18px;
    transform: rotate(-6deg);
  }

  .host-line{
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--ink-muted);
    text-align: center;
    margin: 0 0 12px;
    letter-spacing: 0.2px;
  }

  h1{
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 2.15rem;
    line-height: 1.25;
    margin: 0 0 10px;
    text-align: center;
    letter-spacing: -0.5px;
  }

  .lede{
    color: var(--ink-muted);
    font-size: 0.98rem;
    text-align: center;
    margin: 0 0 44px;
    line-height: 1.6;
    transition: opacity 0.4s ease;
    min-height: 1.6em;
  }
  .lede.fading{ opacity: 0; }

  /* ---- Cookie stage ---- */
  .cookie-stage{
    position: relative;
    width: 250px;
    height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    transition:
      height 0.55s ease 0.15s,
      margin-bottom 0.55s ease 0.15s,
      opacity 0.45s ease,
      transform 0.45s ease;
  }
  .cookie-stage.gone{
    height: 0;
    margin-bottom: 0;
    opacity: 0;
    transform: scale(0.55);
    overflow: hidden;
    pointer-events: none;
  }

  .cookie-plate{
    position: absolute;
    bottom: 26px;
    width: 168px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(43,33,27,0.14), transparent 70%);
    transition: opacity 0.4s ease;
  }
  .cookie-stage.opened .cookie-plate{ opacity: 0; }

  .cookie{
    position: relative;
    width: 240px;
    height: 221px;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(0 10px 14px rgba(43,33,27,0.22));
    transform-origin: center center;
    transition: transform 0.25s ease;
  }

  .cookie:not(.turning):not(.split):hover{ transform: scale(1.05) rotate(-2deg); }

  .cookie img{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  /* 1단계 : 왼쪽으로 천천히 90도 회전 */
  .cookie.turning{
    cursor: default;
    transition: transform 0.9s cubic-bezier(0.34, 0.72, 0.28, 1);
    transform: rotate(-90deg);
  }

  .whole-img{ opacity: 1; }

  /* 2단계 : 화면 기준 세로로 반이 갈라짐
     (쿠키가 -90도 돌아간 상태이므로 이미지 기준 가로로 자른다) */
  .half-img{ opacity: 0; }

  .half-top{
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 47%,
      88% 53%, 76% 46%, 64% 54%, 52% 47%,
      40% 55%, 28% 47%, 16% 54%, 0% 48%
    );
  }
  .half-bottom{
    clip-path: polygon(
      0% 48%, 16% 54%, 28% 47%, 40% 55%,
      52% 47%, 64% 54%, 76% 46%, 88% 53%,
      100% 47%, 100% 100%, 0% 100%
    );
  }

  .cookie.split{
    cursor: default;
    transform: rotate(-90deg);
    transition: none;
  }
  .cookie.split .whole-img{ opacity: 0; }
  .cookie.split .half-top{
    opacity: 1;
    animation: crackToLeft 0.85s cubic-bezier(0.32, 0.5, 0.3, 1) forwards;
  }
  .cookie.split .half-bottom{
    opacity: 1;
    animation: crackToRight 0.85s cubic-bezier(0.32, 0.5, 0.3, 1) forwards;
  }

  /* 쿠키가 회전된 좌표계라 translateY가 화면에서는 좌우 이동이 된다 */
  @keyframes crackToLeft{
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    30%  { transform: translateY(-16px) rotate(-2deg) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) rotate(-10deg) scale(0.92); opacity: 0; }
  }
  @keyframes crackToRight{
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    30%  { transform: translateY(16px) rotate(2deg) scale(1); opacity: 1; }
    100% { transform: translateY(120px) rotate(10deg) scale(0.92); opacity: 0; }
  }

  button{
    font-family: 'Noto Sans KR', sans-serif;
    border: none;
    cursor: pointer;
  }

  /* ---- Result slip ---- */
  .slip-wrap{
    width: 100%;
    display: none;
  }
  .slip-wrap.show{
    display: block;
    transform-origin: center center;
    animation: popIn 0.62s cubic-bezier(0.18, 0.86, 0.3, 1.06) both;
  }
  @keyframes popIn{
    0%   { opacity: 0; transform: scale(0.18); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
  }

  .slip{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px 30px 30px;
    position: relative;
    box-shadow: 0 14px 30px rgba(43,33,27,0.10);
  }
  .slip::before, .slip::after{
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 10px;
    background: repeating-linear-gradient(90deg, var(--paper) 0 8px, transparent 8px 16px);
  }
  .slip::before{ top: -5px; }
  .slip::after{ bottom: -5px; }

  .slip-eyebrow{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 2px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 16px;
  }

  .slip-message{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 1.28rem;
    line-height: 1.75;
    text-align: center;
    color: var(--ink);
    margin: 0 0 26px;
    word-break: keep-all;
  }

  .divider{
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 22px;
  }

  .lucky-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 26px;
  }

  .lucky-label{
    font-size: 0.86rem;
    color: var(--ink-muted);
  }

  .lucky-food{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--seal-dark);
    background: rgba(194,59,34,0.08);
    padding: 5px 14px;
    border-radius: 999px;
  }

  .slip-actions{
    display: flex;
    justify-content: center;
  }

  .copy-btn{
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 500;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .copy-btn:hover{
    border-color: var(--ink-muted);
    background: rgba(43,33,27,0.04);
  }
  .copy-btn.copied{
    border-color: var(--seal);
    color: var(--seal-dark);
    background: rgba(194,59,34,0.06);
  }

  /* ---- 형제식당 안내 (가는 길 / 메뉴판) ---- */
  .info-wrap{
    width: 100%;
    display: none;
    margin-top: 34px;
  }
  .info-wrap.show{
    display: block;
    animation: popIn 0.5s cubic-bezier(0.18, 0.86, 0.3, 1.06) both;
  }

  .info-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 24px;
    box-shadow: 0 10px 22px rgba(43,33,27,0.08);
  }
  .info-card + .info-card{
    margin-top: 18px;
  }

  .info-title{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--seal-dark);
    text-align: center;
    margin: 0 0 14px;
    letter-spacing: 0.3px;
  }

  .info-map{
    width: 100%;
    display: block;
    border-radius: 10px;
    border: 1px solid var(--line);
  }

  .menu-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-flow: column;
    grid-template-rows: repeat(5, auto);
    column-gap: 18px;
  }
  .menu-item{
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 11px 2px;
    border-bottom: 1px dashed var(--line);
  }
  .menu-name{
    color: var(--ink);
    font-weight: 500;
    font-size: 0.9rem;
    line-height: 1.3;
  }
  .menu-badge{
    display: inline-block;
    background: var(--seal);
    color: #FBF3E7;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 999px;
    margin-left: 5px;
    vertical-align: middle;
    letter-spacing: 0.3px;
  }
  .menu-price{
    color: var(--seal-dark);
    font-weight: 700;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  @media (max-width: 380px){
    .menu-list{ column-gap: 10px; }
    .menu-name{ font-size: 0.82rem; }
    .menu-price{ font-size: 0.82rem; }
  }

  /* ---- Draw button (항상 종이 아래) ---- */
  .draw-btn{
    background: var(--seal);
    color: #FBF3E7;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--seal-dark);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: 0.2px;
    margin-top: 32px;
  }
  .draw-btn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--seal-dark);
  }
  .draw-btn:disabled{
    opacity: 0.55;
    cursor: default;
    transform: none;
    box-shadow: 0 6px 0 var(--seal-dark);
  }

  @media (max-width: 380px){
    h1{ font-size: 1.8rem; }
    .cookie-stage{ width: 215px; height: 215px; }
    .cookie{ width: 205px; height: 189px; }
  }

  @media (prefers-reduced-motion: reduce){
    .cookie.turning{ transition: none; }
    .cookie.split .half-top, .cookie.split .half-bottom{ animation: none; opacity: 0; }
    .slip-wrap.show{ animation: none; }
    .cookie-stage{ transition: none; }
  }
</style>
</head>
<body>

<script>
  /* 마침표와 어절 기준으로 줄을 나눈 운세 문구 */
  const fortunes = [
    ['오늘 배운 것이', '미래의 자산이 됩니다. 📚'],
    ['작은 노력이 모여', '큰 성과를 만듭니다.'],
    ['새로운 것을 배우기에', '완벽한 날입니다.'],
    ['꾸준함이 재능을 이깁니다.', '포기하지 마세요!'],
    ['오늘의 실수는', '내일의 성장입니다.'],
    ['진심은 언젠가', '통하게 되어 있습니다.', '조급해하지 마세요.'],
    ['건강한 식단이', '하루를 바꿉니다.'],
    ['규칙적인 생활이', '최고의 보약입니다.'],
    ['예상치 못한 곳에서', '기회가 찾아올 수 있습니다.'],
    ['충분한 휴식이', '내일의 에너지가 됩니다.'],
    ['오늘의 당신은', '매력이 넘칩니다.', '자신감을 가지세요!']
  ];

  const luckyFoods = [
    '계란찜', '매운갈비찜', '된장찌개', '김치찌개',
    '순두부찌개', '뚝배기불고기', '제육볶음'
  ];

  const LEDE_BEFORE = '포춘쿠키를 통해 오늘의 운세를 확인해보세요!';
  const LEDE_AFTER  = '대상 대학생 봉사단과 형제식당이 대학생들의 청춘을 응원합니다❤️';

  const cookie = document.getElementById('cookie');
  const cookieStage = document.getElementById('cookieStage');
  const drawBtn = document.getElementById('drawBtn');
  const lede = document.getElementById('lede');
  const slipWrap = document.getElementById('slipWrap');
  const infoWrap = document.getElementById('infoWrap');
  const slipMessage = document.getElementById('slipMessage');
  const luckyFoodEl = document.getElementById('luckyFood');
  const copyBtn = document.getElementById('copyBtn');

  let busy = false;
  let opened = false;
  let currentLines = [];

  function pickRandom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function setLede(text){
    lede.classList.add('fading');
    setTimeout(() => {
      lede.textContent = text;
      lede.classList.remove('fading');
    }, 380);
  }

  function fillSlip(){
    currentLines = pickRandom(fortunes);
    slipMessage.innerHTML = currentLines
      .map(line => line.replace(/&/g, '&amp;').replace(/</g, '&lt;'))
      .join('<br>');
    luckyFoodEl.textContent = pickRandom(luckyFoods);
    copyBtn.textContent = '운세 복사하기';
    copyBtn.classList.remove('copied');
  }

  function runSequence(){
    busy = true;
    drawBtn.disabled = true;

    /* 1단계 : 왼쪽으로 천천히 90도 회전 */
    cookie.classList.add('turning');

    /* 2단계 : 세로로 갈라져 양쪽으로 벌어지며 사라짐 */
    setTimeout(() => {
      cookie.classList.add('split');
      cookieStage.classList.add('opened');
      if (!opened) {
        setLede(LEDE_AFTER);
        opened = true;
      }
    }, 950);

    /* 3단계 : 쿠키 자리에서 운세 종이가 가운데부터 확대되며 등장 */
    setTimeout(() => {
      fillSlip();
      cookieStage.classList.add('gone');
      slipWrap.classList.add('show');
      infoWrap.classList.add('show');
    }, 1420);

    setTimeout(() => {
      busy = false;
      drawBtn.disabled = false;
      drawBtn.textContent = '다시 뽑기';
    }, 2100);
  }

  function resetStage(){
    slipWrap.classList.remove('show');
    infoWrap.classList.remove('show');
    cookieStage.classList.remove('gone');
    cookie.classList.remove('split');
    cookie.classList.remove('turning');
    cookieStage.classList.remove('opened');
    void cookie.offsetWidth; /* reflow */
  }

  function drawFortune(){
    if (busy) return;
    if (slipWrap.classList.contains('show') || cookie.classList.contains('turning')) {
      busy = true;
      drawBtn.disabled = true;
      resetStage();
      setTimeout(() => { busy = false; runSequence(); }, 420);
      return;
    }
    runSequence();
  }

  drawBtn.addEventListener('click', drawFortune);
  cookie.addEventListener('click', () => {
    if (!busy && !cookie.classList.contains('turning')) drawFortune();
  });

  copyBtn.addEventListener('click', () => {
    const text = '[오늘의 운세]\n' + currentLines.join('\n') +
      '\n\n행운의 음식: ' + luckyFoodEl.textContent;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = '복사 완료!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '운세 복사하기';
        copyBtn.classList.remove('copied');
      }, 2000);
    }).catch(() => {
      alert('복사에 실패했습니다. 다시 시도해주세요.');
    });
  });
</script>
